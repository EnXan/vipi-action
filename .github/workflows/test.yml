name: Test action

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      vipi-ref:
        description: Test with this Git ref of EnXan/VIPI instead of the pinned PyPI release
        required: false
        default: ""

permissions:
  contents: read

jobs:
  selection:
    name: selection (${{ matrix.case }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: empty-diff
          - case: base-rules
          - case: branch-rules
          - case: exclude-input
            exclude: generated/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: vipi-action
          persist-credentials: false

      - name: Create fixture repository
        run: vipi-action/tests/fixture.sh "${{ matrix.case }}"

      # Cloud mode without keys: no models are downloaded, and remaining images
      # fail before OCR, which keeps the test free and fast.
      - name: Run action
        id: vipi
        continue-on-error: true
        uses: ./vipi-action
        with:
          base-ref: main
          modus: cloud
          exclude: ${{ matrix.exclude }}
          vipi-ref: ${{ inputs.vipi-ref }}
        env:
          GOOGLE_CLOUD_API_KEY: ""
          OPENAI_API_KEY: ""

      - name: Check report
        run: >
          python3 vipi-action/tests/check_report.py "${{ matrix.case }}"
          "${{ steps.vipi.outputs.report-path }}"
          "${{ steps.vipi.outputs.selected-images }}"
          "${{ steps.vipi.outcome }}"
